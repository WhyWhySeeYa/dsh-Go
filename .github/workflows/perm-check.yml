name: perm check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Try a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh api -X POST "/repos/$GITHUB_REPOSITORY/releases" -f tag_name=perm-check -f name="perm check" -F draft=true --jq '.id' > /tmp/rid
          echo "created draft release $(cat /tmp/rid)"
          gh api -X DELETE "/repos/$GITHUB_REPOSITORY/releases/$(cat /tmp/rid)"
