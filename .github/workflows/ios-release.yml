# 复用上游的 iOS compile 无签名构建，CI 通过后把 IPA 发到 GitHub Release。
# Release 的标题与说明写「本次构建包含的改动」，用 .github/upstream-sha 与上一个
# Release 记录的同步点做比较，列出上游区间内的提交。
name: iOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty = build-<run_number>)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    # 等同一提交上的 CI 跑完；CI OK 成功才放行。
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      checks: read
    steps:
      - name: Wait for CI OK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for i in $(seq 1 70); do
            state=$(gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "CI OK")][0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            echo "attempt $i: CI OK = ${state:-<missing>}"
            case "$state" in
              "completed success") echo "CI passed"; exit 0 ;;
              "completed "*) echo "::error::CI did not pass ($state)"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::timed out waiting for CI OK"
          exit 1

  compile:
    needs: ci-gate
    uses: ./.github/workflows/ios-compile.yml
    with:
      regression_only: false

  release:
    needs: compile
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: out
      - name: Compose what this build contains
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cur=$(cat .github/upstream-sha 2>/dev/null | tr -d '\n' || true)
          prev_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          prev=""
          if [ -n "$prev_tag" ]; then
            prev=$(git show "$prev_tag:.github/upstream-sha" 2>/dev/null | tr -d '\n' || true)
          fi
          : > notes.md
          # Merge commits say nothing about the change; keep the real subjects.
          if [ -n "$cur" ] && [ -n "$prev" ] && [ "$prev" != "$cur" ]; then
            gh api "repos/ccch1mneyyy/dsh-Go/compare/$prev...$cur" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0])' \
              | grep -v '^- Merge ' >> notes.md || true
          fi
          if [ ! -s notes.md ] && [ -n "$cur" ]; then
            gh api "repos/ccch1mneyyy/dsh-Go/commits?per_page=30" \
              --jq '.[] | "- " + (.commit.message | split("\n")[0])' \
              | grep -v '^- Merge ' >> notes.md || true
          fi
          if [ ! -s notes.md ]; then
            echo "- 同步上游最新代码" > notes.md
          fi
          count=$(grep -c '^- ' notes.md || true)
          first=$(head -1 notes.md | sed 's/^- //')
          if [ "${count:-0}" -gt 1 ]; then
            title="dsh-Go iOS：$count 项改动（$first）"
          else
            title="dsh-Go iOS：$first"
          fi
          {
            echo "## 本次构建包含的改动"
            echo
            cat notes.md
            echo
            echo "---"
            echo "编译提交：\`$GITHUB_SHA\`"
            echo "构建时间：$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "未签名 IPA：需自行签名（ldid / AltStore / Sideloadly），保留 App Group entitlements。"
          } > body.md
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          set -e
          tag="${INPUT_TAG:-build-${GITHUB_RUN_NUMBER}}"
          mv out/DSH-Go-unsigned.ipa out/dsh-go-ios.ipa
          gh release create "$tag" out/dsh-go-ios.ipa --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" --notes-file body.md --prerelease --target "$GITHUB_SHA"
